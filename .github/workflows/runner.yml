name: Test runner contracts
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runner-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: Verify runner failure and invocation contracts
        run: bash scripts/test-runner.sh
      - name: Verify native FSM runner fail-closed contracts (test double only)
        run: bash scripts/test-fsm-native-runner.sh
      - name: Rust FSM model unit tests (host only; not guest execution)
        run: cargo test --manifest-path tools/fsm-model/Cargo.toml --offline --locked
      - name: Rust FSM model format
        run: cargo fmt --manifest-path tools/fsm-model/Cargo.toml -- --check
      - name: Rust FSM model Clippy
        run: cargo clippy --manifest-path tools/fsm-model/Cargo.toml --offline --locked --all-targets -- -D warnings
      - name: Legacy Python FSM comparison suite (temporary until Rust parity)
        run: python3 -m unittest discover -s formal -p 'test_fsm_*.py' -v
