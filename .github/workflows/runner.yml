name: Test runner contracts
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runner-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: Verify runner failure and invocation contracts
        run: bash scripts/test-runner.sh
      - name: Verify native FSM runner fail-closed contracts (test double only)
        run: bash scripts/test-fsm-native-runner.sh
      - name: Check bounded FSM reference model
        run: python3 -m unittest discover -s formal -p 'test_fsm_*.py' -v

  rust-fsm-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash scripts/test-fsm-rust-host-runner.sh
      - name: Execute exact-head Rust host reference suite (not guest execution)
        env:
          ORESLANG_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify-fsm-rust-host.sh --execute
